services:
  - type: web
    name: noobtrade
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    domains:
      - noobtrade.com
      - www.noobtrade.com
      - amplialpha.net
      - www.amplialpha.net
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: MARKET_DATA_TOKEN
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: MARKET_DATA_CACHE_TTL_SECONDS
        value: "90"
      - key: MARKET_DATA_INTRADAY_CACHE_TTL_SECONDS
        value: "20"
      - key: MARKET_DATA_OVERVIEW_CACHE_TTL_SECONDS
        value: "900"
      - key: YAHOO_DATA_BASE_URL
        value: https://query1.finance.yahoo.com
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ENABLE_DEMO_FALLBACK
        value: "true"
      - key: ENABLE_DEMO_FALLBACK_ALL_SYMBOLS
        value: "true"
      - key: EXTERNAL_APP_CORS_ORIGINS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: "production"
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_USE_RELOADER
        value: "false"
      - key: PORT
        value: "5000"
      - key: CORS_ORIGINS
        value: "https://noobtrade.com,https://www.noobtrade.com,https://amplialpha.net,https://www.amplialpha.net"

services:
  - type: web
    name: noobtrade-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "5010"
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_USE_RELOADER
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: MARKET_DATA_CACHE_TTL_SECONDS
        value: "90"
      - key: MARKET_DATA_INTRADAY_CACHE_TTL_SECONDS
        value: "20"
      - key: MARKET_DATA_OVERVIEW_CACHE_TTL_SECONDS
        value: "900"
      - key: YAHOO_DATA_BASE_URL
        value: https://query1.finance.yahoo.com
      - key: OKX_DATA_BASE_URL
        value: https://www.okx.com
      - key: COINGECKO_DATA_BASE_URL
        value: https://api.coingecko.com/api/v3
      - key: CRYPTO_EXCLUDE_STABLECOINS
        value: "true"
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ENABLE_DEMO_FALLBACK
        value: "false"
      - key: ENABLE_DEMO_FALLBACK_ALL_SYMBOLS
        value: "false"
      - key: USE_MOCK_FALLBACK
        value: "false"
      - key: EXTERNAL_APP_CORS_ORIGINS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: MARKET_DATA_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
